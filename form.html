<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <p>
        Please fill in the following details to register as a student.
    </p>

    <hr>

    <form>

        <h2>Personal Information</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">

        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <h2>Academic Information</h2>

        <label for="course">Course:</label>
        <select id="course" name="course">
            <option>B.Tech</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>MCA</option>
        </select>

        <br><br>

        <label for="year">Year:</label>
        <select id="year" name="year">
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <br><br>

        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <h2>Skills</h2>

        <input type="checkbox" id="c" name="skill" value="C">
        <label for="c">C</label>

        <input type="checkbox" id="cpp" name="skill" value="C++">
        <label for="cpp">C++</label>

        <input type="checkbox" id="python" name="skill" value="Python">
        <label for="python">Python</label>

        <input type="checkbox" id="html" name="skill" value="HTML">
        <label for="html">HTML</label>

        <h2>Additional Information</h2>

        <label for="message">Why do you want to join this course?</label>

        <br><br>

        <textarea id="message" name="message" rows="5" cols="40"></textarea>

        <br><br>

        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I agree to the terms and conditions.</label>

        <br><br>

        <button type="submit">Submit Registration</button>
        <button type="reset">Reset Form</button>

    </form>

</body>

</html>
