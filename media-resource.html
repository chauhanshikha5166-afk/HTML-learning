<!DOCTYPE html>
<html>

<head>
    <title>Media and Resources</title>
</head>

<body>

    <header>
        <h1>Media and Learning Resources</h1>
        <p>
            A simple HTML page to practice media elements and external resources.
        </p>
    </header>

    <hr>

    <main>

        <section>
            <h2>Audio</h2>

            <p>Sample audio file:</p>

            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <br>

        <section>
            <h2>Video</h2>

            <p>Sample video file:</p>

            <video width="400" controls>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
        </section>

        <br>

        <section>
            <h2>HTML Learning Resource</h2>

            <iframe
                src="https://www.w3.org/"
                width="600"
                height="300"
                title="HTML learning resource">
            </iframe>
        </section>

        <section>
            <h2>HTML Entities</h2>

            <p>
                Copyright: &copy; 2026
            </p>

            <p>
                Less than: &lt;
                <br>
                Greater than: &gt;
                <br>
                Ampersand: &amp;
            </p>
        </section>

    </main>

    <hr>

    <footer>
        <p>HTML Practice - Day 7</p>
    </footer>

</body>

</html>
